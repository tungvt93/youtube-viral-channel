services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-yvi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-yvi}
      POSTGRES_DB: ${POSTGRES_DB:-yvi}
    ports:
      - "${POSTGRES_PORT:-5440}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-yvi} -d ${POSTGRES_DB:-yvi}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6390}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    command: ["sh", "-c", "pnpm --filter @yvi/api exec prisma migrate deploy && pnpm --filter @yvi/api run start"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-yvi}:${POSTGRES_PASSWORD:-yvi}@postgres:5432/${POSTGRES_DB:-yvi}
      PORT: 3001
      LOG_LEVEL: info
    ports:
      - "${API_PORT:-3001}:3001"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3001/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.worker
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      WORKER_HEALTH_PORT: 3002
      LOG_LEVEL: info
    ports:
      - "${WORKER_HEALTH_PORT:-3002}:3002"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3002/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.web
    environment:
      PORT: 3000
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      - api

volumes:
  postgres_data:
